  document.addEventListener('DOMContentLoaded', () => {
    // Carousel
    const track = document.getElementById('carouselTrack');
    const dotsWrap = document.getElementById('carouselDots');
    memories.forEach((m, i) => {
      const slide = document.createElement('div');
      slide.className = 'carousel-slide';
      slide.innerHTML = `
        <div class="polaroid">
          <div class="polaroid-photo">
            <div class="g-fallback-holder" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:2rem;">🖼️</div>
            <img src="${m.src}" alt="College memory ${i+1}">
          </div>
          <div class="polaroid-cap">${m.cap}${m.date ? `<small>${formatMemoryDate(m.date)}</small>` : ''}</div>
        </div>
      `;
      track.appendChild(slide);

      const dot = document.createElement('button');
      if(i === 0) dot.className = 'active';
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    });

    let idx = 0;
    const dots = dotsWrap.querySelectorAll('button');
    function goTo(i){
      idx = i;
      track.style.transform = `translateX(-${idx * 100}%)`;
      dots.forEach(d => d.classList.remove('active'));
      dots[idx].classList.add('active');
    }
    setInterval(() => { goTo((idx + 1) % memories.length); }, 3200);

    // Grid
    const grid = document.getElementById('galleryGrid');
    memories.forEach((m, i) => {
      const card = document.createElement('div');
      card.className = 'polaroid';
      card.innerHTML = `
        <div class="polaroid-photo">
          <div class="g-fallback-holder" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:1.4rem;">🖼️</div>
          <img src="${m.src}" alt="College memory ${i+1}">
        </div>
        <div class="polaroid-cap">${m.cap}${m.date ? `<small>${formatMemoryDate(m.date)}</small>` : ''}</div>
      `;
      grid.appendChild(card);
    });

    attachImageFallback();

    const ourVideo = document.getElementById('ourVideo');
    ourVideo.addEventListener('error', () => {
      ourVideo.style.display = 'none';
      document.getElementById('videoFallback').style.display = 'block';
    }, true);

    startLoopText(document.getElementById('loopMemories'), [
      'One college...',
      'Thousands of moments...',
      'Countless laughs...',
      'One unforgettable friendship. ❤️'
    ], 2400);
