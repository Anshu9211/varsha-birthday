<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Memories — Anshu &amp; Varsha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body{ margin:0; padding:0; background:#0c0510; height:100%; overflow:hidden; }

  #blastStage{
    position: fixed; inset: 0; background:#0c0510;
    display: flex; align-items: center; justify-content: center;
  }
  #flipFrame{
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #flipFrame img{
    width: 100%; height: 100%; object-fit: cover;
    animation: flipIn 0.28s ease-out;
  }
  @keyframes flipIn{ from{ opacity: 0.3; transform: scale(1.04); } to{ opacity: 1; transform: scale(1); } }

  #flipCounter{
    position: fixed; top: calc(18px + env(safe-area-inset-top,0px)); left: 50%;
    transform: translateX(-50%); z-index: 5;
    color: #fff8f3; font-family: var(--script); font-size: 1.6rem;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }
  #flipBar{
    position: fixed; top: calc(52px + env(safe-area-inset-top,0px)); left: 12px; right: 12px;
    height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); overflow: hidden; z-index: 5;
  }
  #flipBar i{ display:block; height:100%; width:0%; background: linear-gradient(90deg, var(--pink), var(--gold)); }

  .blast-flash{
    position: fixed; inset: 0; background: #fff; z-index: 200;
    opacity: 0; pointer-events: none;
  }
  .blast-flash.go{ animation: blastFlash 650ms ease-out forwards; }
  @keyframes blastFlash{ 0%{ opacity: 0; } 15%{ opacity: 1; } 100%{ opacity: 0; } }

  #heartStage{
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #2a1530 0%, #0c0510 75%);
    text-align: center; padding: 20px;
  }
  #heartGrid{
    display: grid; gap: 3px;
    margin-bottom: 1.4rem;
  }
  .heart-cell{ width: 100%; aspect-ratio: 1; border-radius: 3px; overflow: hidden; opacity: 0; transform: scale(0.4); }
  .heart-cell.pop{ animation: heartCellPop 420ms ease-out forwards; }
  .heart-cell img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes heartCellPop{ to{ opacity: 1; transform: scale(1); } }

  #heartCaption h2{ font-family: var(--script); color: #fff8f3; font-size: 1.9rem; margin: 0 0 0.4rem; }
  #heartCaption p{ color: rgba(255,248,243,0.8); font-size: 0.92rem; margin: 0 0 1.4rem; max-width: 320px; }

  .story-close{ position: fixed; top: calc(16px + env(safe-area-inset-top,0px)); right: 14px; z-index: 20; }
</style>
</head>
<body>

<div class="blast-flash" id="blastFlash"></div>

<div id="blastStage">
  <div id="flipCounter">1 / 100</div>
  <div id="flipBar"><i id="flipBarFill"></i></div>
  <div id="flipFrame"></div>
</div>

<div id="heartStage">
  <div id="heartGrid"></div>
  <div id="heartCaption">
    <h2>100 moments... one heart</h2>
    <p>Every picture is a piece of us. Here's to a hundred more. ❤️</p>
    <a href="birthday.html" class="story-entry">Back to your Birthday page</a>
  </div>
</div>

<a href="memories.html" class="story-close" aria-label="Close">✕</a>

<script src="js/script.js"></script>
<script>
  // Real unique photos in this zip (only 22 — we cycle through them to reach the 100 count)
  const PHOTOS = [
    "images/1.jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.35.27 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.35.28 PM (1).jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.35.28 PM (2).jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.35.28 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.35.29 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.35.38 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.36.02 PM (1).jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.36.02 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.36.03 PM (1).jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.36.03 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.36.04 PM (1).jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.36.04 PM (2).jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.36.04 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.36.05 PM (1).jpeg",
    "images/WhatsApp Image 2026-09-24 at 10.36.05 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 11.00.40 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 11.00.41 PM (1).jpeg",
    "images/WhatsApp Image 2026-09-24 at 11.00.41 PM (2).jpeg",
    "images/WhatsApp Image 2026-09-24 at 11.00.41 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 11.00.42 PM.jpeg",
    "images/WhatsApp Image 2026-09-24 at 11.00.43 PM.jpeg"
  ];

  const TOTAL = 100;
  const frame = document.getElementById('flipFrame');
  const counter = document.getElementById('flipCounter');
  const barFill = document.getElementById('flipBarFill');

  let i = 0;
  function nextFrame(){
    i++;
    counter.textContent = i + ' / ' + TOTAL;
    barFill.style.width = (i / TOTAL * 100) + '%';

    const img = document.createElement('img');
    img.src = PHOTOS[(i - 1) % PHOTOS.length];
    frame.innerHTML = '';
    frame.appendChild(img);

    if(i >= TOTAL){
      setTimeout(blast, 380);
      return;
    }
    // speeds up slightly as it goes for a "building energy" feel
    const speed = Math.max(45, 220 - i * 1.6);
    setTimeout(nextFrame, speed);
  }
  nextFrame();

  function blast(){
    document.getElementById('blastStage').style.display = 'none';
    const flash = document.getElementById('blastFlash');
    flash.classList.add('go');
    if(window.launchConfetti) launchConfetti(3200);

    setTimeout(buildHeart, 300);
  }

  // Heart shape via the classic heart curve, sampled over a grid
  function buildHeart(){
    const stage = document.getElementById('heartStage');
    stage.style.display = 'flex';

    const cols = 17, rows = 15;
    const grid = document.getElementById('heartGrid');
    const cellPx = Math.min(20, Math.floor(Math.min(window.innerWidth * 0.82, 340) / cols));
    grid.style.gridTemplateColumns = `repeat(${cols}, ${cellPx}px)`;

    const cells = [];
    for(let r = 0; r < rows; r++){
      for(let c = 0; c < cols; c++){
        const x = (c / (cols - 1)) * 3 - 1.5;
        const y = 1.25 - (r / (rows - 1)) * 2.5;
        const val = Math.pow(x*x + y*y - 1, 3) - x*x*y*y*y;
        if(val <= 0) cells.push({ r, c });
      }
    }

    let p = 0;
    cells.forEach((cell, idx) => {
      const div = document.createElement('div');
      div.className = 'heart-cell';
      div.style.gridRowStart = cell.r + 1;
      div.style.gridColumnStart = cell.c + 1;
      const img = document.createElement('img');
      img.src = PHOTOS[p % PHOTOS.length];
      p++;
      div.appendChild(img);
      grid.appendChild(div);
      setTimeout(() => div.classList.add('pop'), idx * 12);
    });
  }
</script>
</body>
</html>
