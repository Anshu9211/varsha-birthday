<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Surprise For Varsha 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  #page0{ min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .gift-box{ font-size: 4.5rem; animation: giftShake 2.2s ease-in-out infinite; }
  @keyframes giftShake{
    0%, 80%, 100%{ transform: rotate(0deg); }
    83%{ transform: rotate(-8deg); }
    86%{ transform: rotate(8deg); }
    89%{ transform: rotate(-6deg); }
    92%{ transform: rotate(4deg); }
    95%{ transform: rotate(0deg); }
  }
  .welcome-title{ margin-top: 1rem; }
  .welcome-sub{ max-width: 340px; margin: 0.6rem auto 1.8rem; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="transition-overlay"><span class="glow-heart">❤</span></div>

<main class="page-wrap" id="page0">
  <p class="eyebrow">OPEN WHEN YOU'RE READY</p>
  <div class="gift-box">🎁</div>
  <h1 class="page-title welcome-title script">A little surprise for you, Varsha</h1>
  <p class="body-text welcome-sub">Something's been put together just for you. Ready to see it? 💕</p>
  <a href="index.html" data-nav class="btn-glow">TAP TO OPEN ✨</a>
</main>

<script src="js/script.js"></script>
</body>
</html>
